name: Cadence
options:
  bundleIdPrefix: com.darshshah
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    PRODUCT_BUNDLE_IDENTIFIER: com.darshshah.Cadence
    INFOPLIST_FILE: Cadence/Supporting/Info.plist
    INFOPLIST_KEY_CFBundleDisplayName: Cadence
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    GOOGLE_OAUTH_CLIENT_ID: ""
    GOOGLE_OAUTH_CLIENT_SECRET: ""
    GOOGLE_OAUTH_REDIRECT_SCHEME: com.darshshah.Cadence
packages:
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 0.18.0

targets:
  Cadence:
    type: application
    platform: macOS
    sources:
      - path: Cadence
    dependencies:
      - package: argmax-oss-swift
        product: WhisperKit
    settings:
      base:
        PRODUCT_NAME: Cadence
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Cadence/Cadence.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development: darsh.shah@icloud.com (7FKP4PLNZ3)"
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: P3MT7UXJ5N
          PRODUCT_NAME: Cadence Debug
          PRODUCT_MODULE_NAME: Cadence
          PRODUCT_BUNDLE_IDENTIFIER: com.darshshah.Cadence.debug
          INFOPLIST_KEY_CFBundleDisplayName: Cadence Debug
          GOOGLE_OAUTH_REDIRECT_SCHEME: com.darshshah.Cadence.debug
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: P3MT7UXJ5N
          ENABLE_HARDENED_RUNTIME: YES
          PRODUCT_BUNDLE_IDENTIFIER: com.darshshah.Cadence
          INFOPLIST_KEY_CFBundleDisplayName: Cadence
    scheme:
      testTargets:
        - CadenceTests
  CadenceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CadenceTests
    dependencies:
      - target: Cadence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          TEST_HOST: $(BUILT_PRODUCTS_DIR)/Cadence Debug.app/Contents/MacOS/Cadence Debug
        Release:
          TEST_HOST: $(BUILT_PRODUCTS_DIR)/Cadence.app/Contents/MacOS/Cadence
  CadenceUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: CadenceUITests
    dependencies:
      - target: Cadence
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Cadence
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.darshshah.CadenceUITests
    scheme:
      testTargets:
        - CadenceUITests
